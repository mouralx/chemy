name: Chemy CI & Scientific Verification

on:
  push:
    branches: [ main, fix/*, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Audit & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup Python Environment
      uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Hash-Locked RDKit Reference Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements-reference.txt --require-hashes

    - name: Verify Live RDKit External Dataset Derivation Gate (48 Compounds across 3 Partitions)
      run: |
        python3 scripts/generate_reference_dataset.py --verify src/Chemy.Core.Tests/ValidationData/reference_compounds.json

    - name: Verify Pinned RDKit UFF Diverse Molecules & Butane Reference Energies
      run: |
        python3 scripts/generate_uff_reference.py --verify src/Chemy.Core.Tests/ValidationData/rdkit_uff_butane_reference.json

    - name: Enforce Scientific Claim, Artifact Hash & Contract Consistency
      run: python3 scripts/verify_claim_consistency.py

    - name: Generate Initial RDKit Interop Fixtures (Direction 2)
      run: |
        python3 scripts/verify_molfile_interop.py --generate-rdkit

    - name: Setup .NET 10 SDK
      uses: actions/setup-dotnet@39504859a4d33458efecad9d9eb933e49dcadfa7 # v4.3.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore src/Chemy.slnx

    - name: Build with Warnings as Errors
      run: dotnet build src/Chemy.slnx --configuration Release --no-restore --warnaserror

    - name: Run Scientific Test Suite with Coverage
      run: dotnet test src/Chemy.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: Verify Live Chemy-Exported Molfiles & SDF with RDKit 2025.09.2 (Direction 1)
      run: |
        python3 scripts/verify_molfile_interop.py --verify-chemy --strict --chemy-dir src/Chemy.Core.Tests/bin/Release/net10.0/ValidationData/interop_fixtures/chemy_exported

    - name: Verify Strict Interoperability Gate Rejects Missing Explicit Directory (Negative Path)
      run: |
        python3 -c "
        import subprocess, sys, tempfile, uuid, os
        missing_dir = os.path.join(tempfile.gettempdir(), 'definitely-missing-chemy-' + uuid.uuid4().hex)
        res = subprocess.run(['python3', 'scripts/verify_molfile_interop.py', '--verify-chemy', '--strict', '--chemy-dir', missing_dir], capture_output=True, text=True)
        if res.returncode != 0:
            print('PASS: Negative path test confirmed: explicitly missing directory correctly rejected with exit code', res.returncode)
        else:
            print('FAIL: Explicitly missing directory unexpectedly passed!', file=sys.stderr)
            sys.exit(1)
        "

    - name: Enforce Scientific Line & Branch Coverage Floors
      run: |
        python3 scripts/verify_coverage.py "**/coverage.cobertura.xml"

    - name: Upload Test Coverage Artifact
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
      with:
        name: code-coverage-report
        path: '**/TestResults/**/coverage.cobertura.xml'
        retention-days: 14

    - name: Security & Dependency Vulnerability Audit Gate
      run: |
        audit_output=$(dotnet list src/Chemy.slnx package --vulnerable --include-transitive)
        echo "$audit_output"
        if echo "$audit_output" | grep -iq "has the following vulnerable packages"; then
          echo "::error::Vulnerable dependencies detected in repository solution!"
          exit 1
        fi
